name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        rails: ["7.1", "7.2", "8.0", "8.1"]
        exclude:
          # Rails 7.x predates Ruby 4.0.
          - { ruby: "4.0", rails: "7.1" }
          - { ruby: "4.0", rails: "7.2" }
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    env:
      RAILS_VERSION: "~> ${{ matrix.rails }}.0"
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: rails-${{ matrix.rails }}
      - run: bundle exec rspec
