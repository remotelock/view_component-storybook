plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "docs/**/*"
    - "gemfiles/**/*"
    - "vendor/**/*"
    - "tmp/**/*"

Layout/LineLength:
  Max: 130

Metrics/AbcSize:
  Max: 30

Metrics/ClassLength:
  Max: 150

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/MethodLength:
  Max: 30

Metrics/PerceivedComplexity:
  Max: 10

Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "**/*.rake"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Rails/RakeEnvironment:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - "spec/view_component/storybook/params_coercion_spec.rb"
    - "spec/view_component/storybook/rake_tasks_spec.rb"

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 10

RSpec/NestedGroups:
  Max: 5

RSpec/NamedSubject:
  Enabled: false

RSpec/SubjectStub:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/SpecFilePathFormat:
  Enabled: false

Style/FormatStringToken:
  Enabled: false

RSpec/IncludeExamples:
  Enabled: false
